name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The new version number (in x.x.x format)"
        required: true

permissions:
  contents: write

jobs:
  update-formula:
    name: Bump crowdin@5 formula
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update crowdin@5 formula
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          curl -fsSL "https://github.com/crowdin/crowdin-cli/releases/download/$VERSION/crowdin-cli_checksums.sha256" -o checksums.sha256

          ruby .github/scripts/update-formula.rb "$VERSION" checksums.sha256
          rm checksums.sha256

          ruby -c Formula/crowdin@5.rb
          git diff Formula/crowdin@5.rb

      - name: Commit and push
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "crowdin@5 $VERSION"
          git push
